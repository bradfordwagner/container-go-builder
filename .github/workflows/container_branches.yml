name: container-branches
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch: {}

jobs:
  matrix:
    name: matrix
    runs-on: ubuntu-24.04
    outputs:
      builds: ${{ steps.gen.outputs.builds }}
      manifests: ${{ steps.gen.outputs.manifests }}
      push_enabled: ${{ steps.gen.outputs.push_enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: generate
        id: gen
        run: |
          echo "builds=$(python3 scripts/matrix.py)" >> $GITHUB_OUTPUT
          echo "manifests=$(python3 scripts/matrix.py manifests)" >> $GITHUB_OUTPUT
          echo "push_enabled=$(python3 -c "import yaml; c=yaml.safe_load(open('config.yaml')); print(str(c.get('push_enabled',False)).lower())")" >> $GITHUB_OUTPUT

  build:
    name: ${{ matrix.cfg.index }}:${{ matrix.cfg.os }}:${{ matrix.cfg.go_version }}:${{ matrix.cfg.arch_short }}
    needs: matrix
    runs-on: ${{ matrix.cfg.runner }}
    permissions: write-all
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJSON(needs.matrix.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set DOCKER_CONFIG
        if: needs.matrix.outputs.push_enabled == 'true'
        run: |
          id=docker_configs/${RANDOM}
          mkdir -p $HOME/${id}/.docker
          echo "DOCKER_CONFIG=$HOME/${id}/.docker" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        name: login=ghcr.io
        if: needs.matrix.outputs.push_enabled == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: build
        run: |
          docker build \
            --provenance=false \
            --build-arg UPSTREAM=${{ matrix.cfg.upstream_ref }} \
            --build-arg RUNTIME=${{ matrix.cfg.runtime_ref }} \
            --build-arg GO_VERSION=${{ matrix.cfg.go_version }} \
            -t ${{ matrix.cfg.target_repo }}:${{ matrix.cfg.go_version }}-${{ matrix.cfg.os }}-${{ matrix.cfg.arch_short }} \
            .
      - name: push
        if: needs.matrix.outputs.push_enabled == 'true'
        run: docker push ${{ matrix.cfg.target_repo }}:${{ matrix.cfg.go_version }}-${{ matrix.cfg.os }}-${{ matrix.cfg.arch_short }}

  manifest:
    name: manifest=${{ matrix.cfg.go_version }}-${{ matrix.cfg.os }}
    needs: [matrix, build]
    runs-on: ubuntu-24.04
    permissions: write-all
    if: needs.matrix.outputs.push_enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        cfg: ${{ fromJSON(needs.matrix.outputs.manifests) }}
    steps:
      - name: Set DOCKER_CONFIG
        run: |
          id=docker_configs/${RANDOM}
          mkdir -p $HOME/${id}/.docker
          echo "DOCKER_CONFIG=$HOME/${id}/.docker" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        name: login=ghcr.io
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false
      - name: create and push manifest
        run: |
          repo=${{ matrix.cfg.target_repo }}
          tag=${{ matrix.cfg.go_version }}-${{ matrix.cfg.os }}
          srcs=$(echo '${{ toJSON(matrix.cfg.arch_shorts) }}' | jq -r '.[] | "'"${repo}:${tag}"'-\(.)"' | tr '\n' ' ')
          docker manifest create ${repo}:${tag} ${srcs}
          docker manifest push ${repo}:${tag}
